<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#b8901f" />
    <!-- Two faces rather than one family at five weights: Suez One has an actual
         voice and real Hebrew for headings and figures, Alef carries body text at
         400/700. Hierarchy then comes from the pairing instead of from a synthesised
         bold, which is what smeared at small sizes. Preconnected so the first paint is
         not held up, and the system stack stays as the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Suez+One&display=swap" rel="stylesheet" />
    <meta name="description" content="יומן עבודה לצוותים קטנים: הקצאת משימות עם תאריך יעד, אסמכתאות ביצוע ותיעוד מלא של מי עשה מה ומתי." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Work It — יומן עבודה</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
